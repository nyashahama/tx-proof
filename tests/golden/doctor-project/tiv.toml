schema_version = 1

[run]
cases = 20
seed = 424242
max_actions_per_case = 40
case_timeout = "90s"
parallelism = 1
artifact_dir = ".tiv/runs"

[safety]
mode = "local_disposable_only"
deny_public_ips = true
deny_live_stripe_keys = true
database_name_prefix = "tiv_case_"
require_database_marker = true
max_database_bytes = 2147483648

[compose]
project_name = "tiv-reference-app-spike"
files = ["../../../spike/reference-app.compose.yaml"]
application_service = "reference-app"
postgres_service = "postgres"
worker_services = []
health_url = "http://127.0.0.1:18080/healthz"
health_timeout = "30s"

[database]
admin_url_env = "TIV_POSTGRES_ADMIN_URL"
case_url_env = "DATABASE_URL"
strategy = "template_then_dump_fallback"
case_database = "tiv_case_checkout"
baseline_database = "tiv_base_checkout"
invariant_role = "tiv_invariant"
quiescence_sql = "quiescence.sql"
quiescence_stable_for = "500ms"
quiescence_timeout = "10s"
statement_timeout = "2s"
lock_timeout = "500ms"

[stripe]
adapter = "payment_intent_v1"
api_version = "2026-02-25.clover"
application_base_url = "http://stripe-fixture:12111"
webhook_url = "http://reference-app:18080/webhooks/stripe"
webhook_secret_env = "TIV_STRIPE_WEBHOOK_SECRET"
control_url = "http://127.0.0.1:12112"
control_token_env = "TIV_FIXTURE_CONTROL_TOKEN"
poll_interval = "10ms"

[driver]
method = "POST"
url = "http://127.0.0.1:18080/api/checkout"
body_file = "checkout.json"
timeout = "10s"

[faults.webhooks]
duplicate_max = 3
allow_reorder = true
allow_drop = true
delay_ms = [0, 10, 100, 1000, 5000]

[faults.stripe_api]
outcomes = [
  "normal",
  "pre_execute_429",
  "pre_execute_500",
  "post_execute_500",
  "commit_then_close",
  "commit_then_delay",
]

[faults.process]
service = "reference-app"
max_kills_per_case = 1
cut_points = [
  "client_request_forwarded",
  "client_response_observed",
  "webhook_request_forwarded",
  "webhook_response_observed",
  "sql_probe",
]
sql_probe_file = "kill_probe.sql"

[[invariants]]
id = "provider-object-unique"
sql_file = "invariants/01_provider_object_unique.sql"
expect = "zero_rows"

[[invariants]]
id = "webhook-effect-at-most-once"
sql_file = "invariants/02_webhook_effect_at_most_once.sql"
expect = "zero_rows"

[[invariants]]
id = "paid-order-amount-conservation"
sql_file = "invariants/03_paid_order_amount_conservation.sql"
expect = "zero_rows"

[[invariants]]
id = "terminal-success-monotonic"
sql_file = "invariants/04_terminal_success_monotonic.sql"
expect = "zero_rows"

[[invariants]]
id = "balanced-ledger"
sql_file = "invariants/05_balanced_ledger.sql"
expect = "zero_rows"
