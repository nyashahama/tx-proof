name: Rust verification

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format, lint, test, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.94.1
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Deny Clippy warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run the workspace test suite
        run: cargo test --workspace --all-targets

      - name: Prove the non-mutating doctor Docker boundary
        run: cargo test -p tiv-cli --test doctor -- --ignored --nocapture

      - name: Build release binaries
        run: cargo build --workspace --release

  postgres-spike:
    name: PostgreSQL truth spike
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.94.1

      - name: Validate and fingerprint the isolated topology
        run: |
          mkdir -p ci-evidence
          docker compose \
            --project-name tiv-truth-spike-postgres \
            --project-directory "$PWD" \
            --file spike/postgres.compose.yaml \
            config --quiet
          docker compose \
            --project-name tiv-truth-spike-postgres \
            --project-directory "$PWD" \
            --file spike/postgres.compose.yaml \
            config --hash '*' > ci-evidence/postgres.compose.hash

      - name: Start the isolated PostgreSQL service
        run: |
          docker compose \
            --project-name tiv-truth-spike-postgres \
            --project-directory "$PWD" \
            --file spike/postgres.compose.yaml \
            up --detach --wait postgres

      - name: Prove reset, invariant, and fresh-baseline replay
        env:
          TIV_POSTGRES_TEST_PORT: "15432"
        run: |
          set -o pipefail
          cargo test -p tiv-runtime postgres::spike::tests:: \
            -- --ignored --test-threads=1 \
            --skip real_reference_app_ \
            2>&1 \
            | tee ci-evidence/postgres-spike.log

      - name: Prove the bounded five-query snapshot runner
        env:
          TIV_POSTGRES_TEST_PORT: "15432"
        run: |
          set -o pipefail
          cargo test -p tiv-runtime postgres::snapshot::tests:: \
            -- --ignored --test-threads=1 \
            2>&1 \
            | tee ci-evidence/postgres-snapshot.log

      - name: Capture PostgreSQL logs after a failure
        if: failure()
        continue-on-error: true
        run: |
          docker compose \
            --project-name tiv-truth-spike-postgres \
            --project-directory "$PWD" \
            --file spike/postgres.compose.yaml \
            logs --no-color postgres > ci-evidence/postgres.log

      - name: Remove only the isolated truth-spike project
        if: always()
        run: |
          docker compose \
            --project-name tiv-truth-spike-postgres \
            --project-directory "$PWD" \
            --file spike/postgres.compose.yaml \
            down --volumes --remove-orphans

      - name: Retain bounded truth-spike evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postgres-truth-spike
          path: ci-evidence/
          if-no-files-found: error
          retention-days: 14

  reference-app-spike:
    name: Real reference application truth spike
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.94.1

      - name: Validate and fingerprint the isolated topology
        run: |
          mkdir -p ci-evidence
          docker compose \
            --project-name tiv-reference-app-spike \
            --project-directory "$PWD" \
            --file spike/reference-app.compose.yaml \
            config --quiet
          docker compose \
            --project-name tiv-reference-app-spike \
            --project-directory "$PWD" \
            --file spike/reference-app.compose.yaml \
            config --hash '*' > ci-evidence/reference-app.compose.hash

      - name: Build and start the isolated reference stack
        run: |
          docker compose \
            --project-name tiv-reference-app-spike \
            --project-directory "$PWD" \
            --file spike/reference-app.compose.yaml \
            up --detach --build --wait

      - name: Prove three fresh-baseline reference application attempts
        env:
          TIV_FIXTURE_CONTROL_TOKEN: run-scoped-control-token
          TIV_POSTGRES_ADMIN_PASSWORD: tiv-local-only-password
          TIV_POSTGRES_APPLICATION_PASSWORD: tiv-app-local-only-password
        run: |
          set -o pipefail
          cargo run --quiet -p tiv-cli --bin tiv -- \
            replay reference-app-evidence \
            --trace spike/compiled-trace-v1.json \
            --postgres-port 15432 \
            --reference-app-url http://127.0.0.1:18080 \
            --fixture-control-url http://127.0.0.1:12112 \
            | tee ci-evidence/reference-app-evidence.json
          jq -e '
            .schema_version == 2 and
            .provider_object_counts == [2, 2, 2] and
            .failure_identity.invariant_id == "provider-object-unique" and
            .failure_identity.checkpoint_id == "checkout-quiescent" and
            .reproduction.attempt_count == 3 and
            .reproduction.matching_failure_count == 3 and
            .reproduction.classification == "stable" and
            (.database_resets | length) == 2 and
            all(.database_resets[]; .before_oid != .after_oid) and
            .database_resets[0].after_oid == .database_resets[1].before_oid
          ' ci-evidence/reference-app-evidence.json

      - name: Prove one compiled serial case through the live stack
        env:
          TIV_FIXTURE_CONTROL_TOKEN: run-scoped-control-token
          TIV_POSTGRES_ADMIN_PASSWORD: tiv-local-only-password
          TIV_POSTGRES_APPLICATION_PASSWORD: tiv-app-local-only-password
        run: |
          set -o pipefail
          cargo run --quiet -p tiv-cli --bin tiv -- \
            replay reference-app-case \
            --plan spike/planned-case-http-v1.json \
            --journal ci-evidence/reference-app-case.jsonl \
            --postgres-port 15432 \
            --reference-app-url http://127.0.0.1:18080 \
            --fixture-control-url http://127.0.0.1:12112 \
            | tee ci-evidence/reference-app-case.json
          jq -e '
            .schema_version == 1 and
            .seed == 3 and
            .planned_action_count == 8 and
            .executed_action_count == 8 and
            .provider_object_count == 1 and
            .database_oid > 0 and
            .journal_record_count >= 16 and
            (.journal_last_record_hash | length) == 64 and
            (.invariant_outcomes | length) == 5 and
            all(.invariant_outcomes[]; .verdict == "held")
          ' ci-evidence/reference-app-case.json

      - name: Prove an attested application SIGKILL and restart
        env:
          TIV_FIXTURE_CONTROL_TOKEN: run-scoped-control-token
          TIV_POSTGRES_ADMIN_PASSWORD: tiv-local-only-password
          TIV_POSTGRES_APPLICATION_PASSWORD: tiv-app-local-only-password
        run: |
          set -o pipefail
          cargo run --quiet -p tiv-cli --bin tiv -- \
            replay reference-app-case \
            --plan crates/tiv-core/tests/golden/planned-case-v3.json \
            --journal ci-evidence/reference-app-process-case.jsonl \
            --postgres-port 15432 \
            --reference-app-url http://127.0.0.1:18080 \
            --fixture-control-url http://127.0.0.1:12112 \
            | tee ci-evidence/reference-app-process-case.json
          jq -e '
            .schema_version == 1 and
            .seed == 42 and
            .planned_action_count == 15 and
            .executed_action_count == 15 and
            .provider_object_count == 2 and
            .database_oid > 0 and
            .journal_record_count >= 30 and
            (.journal_last_record_hash | length) == 64 and
            (.invariant_outcomes | length) == 5 and
            all(.invariant_outcomes[]; .verdict == "held")
          ' ci-evidence/reference-app-process-case.json

      - name: Capture isolated service logs after a failure
        if: failure()
        continue-on-error: true
        run: |
          docker compose \
            --project-name tiv-reference-app-spike \
            --project-directory "$PWD" \
            --file spike/reference-app.compose.yaml \
            logs --no-color --tail 500 > ci-evidence/reference-app-services.log

      - name: Remove only the isolated reference-app project
        if: always()
        run: |
          docker compose \
            --project-name tiv-reference-app-spike \
            --project-directory "$PWD" \
            --file spike/reference-app.compose.yaml \
            down --volumes --remove-orphans

      - name: Retain bounded reference-app evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reference-app-truth-spike
          path: ci-evidence/
          if-no-files-found: error
          retention-days: 14
